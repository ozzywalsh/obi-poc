apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmin-exporter
  namespace: sample-app
  labels:
    app: garmin-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garmin-exporter
  template:
    metadata:
      labels:
        app: garmin-exporter
      annotations:
        "obi.instrument": "true"
    spec:
      containers:
        - name: garmin-exporter
          image: ghcr.io/barnes-c/garmin_exporter:0.2.0
          env:
            - name: GARMIN_USERNAME
              value: "dummy@example.com"
            - name: GARMIN_PASSWORD
              value: "dummy"
          ports:
            - containerPort: 10045
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 10045
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 10045
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: garmin-exporter
  namespace: sample-app
  labels:
    app: garmin-exporter
spec:
  selector:
    app: garmin-exporter
  ports:
    - port: 10045
      targetPort: 10045
      protocol: TCP
