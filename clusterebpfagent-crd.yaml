---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: clusterebpfagents.opentelemetry.io
spec:
  group: opentelemetry.io
  names:
    kind: ClusterEBPFAgent
    listKind: ClusterEBPFAgentList
    plural: clusterebpfagents
    shortNames:
    - cebpfa
    singular: clusterebpfagent
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: OBI operation mode
      jsonPath: .spec.mode
      name: Mode
      type: string
    - description: Applied OBI image
      jsonPath: .status.image
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterEBPFAgent is the schema for the clusterebpfagents API.
          Each instance provisions an OBI DaemonSet and associated RBAC across the cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterEBPFAgentSpec defines the desired state of ClusterEBPFAgent.
            properties:
              additionalCapabilities:
                description: |-
                  AdditionalCapabilities supplements the base capability set derived from Mode.
                  Use this for capabilities that are not required by the declared mode but are
                  needed for specific kernel configurations or optional OBI features, for example:

                    - SYS_ADMIN: required for Go library-level trace context propagation
                                 (bpf_probe_write_user). Also required on AKS and EKS where
                                 kernel.perf_event_paranoid > 1 by default.
                items:
                  description: Capability represent POSIX capabilities type
                  type: string
                type: array
              config:
                description: |-
                  Config is the raw OBI configuration passed through verbatim to the agent ConfigMap.
                  The operator does not interpret or validate the content; it is mounted at
                  /config/obi-config.yml inside the DaemonSet pod.
                  The discovery.instrument section is reserved — it is generated by the controller
                  from OBIInstrumentation resources and must not be set here.
                  Refer to the OBI configuration documentation for available fields.
                type: string
              deploymentModel:
                default: standalone
                description: |-
                  DeploymentModel selects the deployment topology. Defaults to standalone.

                  standalone: runs otel/ebpf-instrumentation; spec.config is OBI daemon YAML.
                  collector:  runs a user-provided collector image embedding the OBI receiver;
                              spec.config is OTel Collector YAML (receivers section is reserved).
                enum:
                - standalone
                - collector
                type: string
              hostPID:
                default: true
                description: |-
                  HostPID controls whether the DaemonSet pods share the host PID namespace.
                  Required for OBI to resolve eBPF probe PIDs to container workloads.
                  Defaults to true.
                type: boolean
              image:
                description: |-
                  Image is the container image to use for the OBI DaemonSet.
                  Defaults to the operator's bundled OBI image version.
                type: string
              imagePullPolicy:
                description: ImagePullPolicy defines the pull policy for the OBI container
                  image.
                type: string
              imagePullSecrets:
                description: ImagePullSecrets is a list of references to secrets for
                  pulling the OBI image.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              mode:
                default: application
                description: |-
                  Mode selects the OBI operation mode and determines the base Linux capability
                  set provisioned by the operator. Defaults to application.

                  application: provisions capabilities for HTTP/gRPC uprobe-based tracing.
                  network:     provisions capabilities for TC-based network flow observability.
                  full:        union of application and network capability sets.
                enum:
                - application
                - network
                - full
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector constrains which nodes the DaemonSet pods
                  are scheduled to.
                type: object
              resources:
                description: Resources defines compute resource requests and limits
                  for the OBI container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              tenantDelegation:
                description: |-
                  TenantDelegation controls whether OBIInstrumentation resources in tenant
                  namespaces are honoured by the controller.
                properties:
                  mode:
                    default: AllowList
                    description: |-
                      Mode controls which namespaces may contribute OBIInstrumentation resources.
                      Defaults to AllowList.
                    enum:
                    - AllowList
                    - AlwaysCollect
                    type: string
                  namespacesAllowList:
                    description: |-
                      NamespacesAllowList is the explicit list of namespaces permitted to create
                      OBIInstrumentation resources. Only used when Mode is AllowList.
                    items:
                      type: string
                    type: array
                type: object
              tolerations:
                description: Tolerations allow the DaemonSet pods to be scheduled
                  on nodes with matching taints.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
            type: object
          status:
            description: ClusterEBPFAgentStatus defines the observed state of ClusterEBPFAgent.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the ClusterEBPFAgent state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              image:
                description: Image is the OBI container image resolved and applied
                  to the DaemonSet.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  for this resource.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
